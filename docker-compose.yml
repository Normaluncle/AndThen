name: andthen

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://andthen:${POSTGRES_PASSWORD:-andthen}@db:5432/andthen
  DB_POOL_MAX: "10"
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
  LLM_MAX_INPUT_BYTES: ${LLM_MAX_INPUT_BYTES:-131072}
  LLM_MAX_RESPONSE_BYTES: ${LLM_MAX_RESPONSE_BYTES:-131072}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
  LLM_MAX_CONCURRENT_JOBS: ${LLM_MAX_CONCURRENT_JOBS:-2}
  LLM_DAILY_JOB_LIMIT: ${LLM_DAILY_JOB_LIMIT:-1000}
  SESSION_TTL_SECONDS: "2592000"
  LOGIN_TOKEN_TTL_SECONDS: "3600"

services:
  db:
    # Pinned by digest: `18-alpine` alone is a floating tag.
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: andthen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andthen}
      POSTGRES_DB: andthen
      # Pin PGDATA inside the mounted volume (stable across image layouts).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - andthen-pgdata:/var/lib/postgresql/data
    # Deliberately NO published ports: the database is not reachable from the
    # LAN. docker-compose.test.yml adds a 127.0.0.1-only port for integration tests.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andthen -d andthen"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [internal]
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    image: andthen-backend:local
    command: ["node", "dist/db/migrate.js"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: andthen-backend:local
    command: ["node", "dist/server.js"]
    environment: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    restart: unless-stopped

  worker:
    image: andthen-backend:local
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      # A stable id is required so the healthcheck can find this worker's
      # heartbeat row.
      WORKER_ID: ${WORKER_ID:-worker-1}
      WORKER_CONCURRENCY: "4"
      JOB_LEASE_SECONDS: "60"
      JOB_POLL_INTERVAL_MS: "1000"
      WORKER_HEALTH_MAX_AGE_SECONDS: "60"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Reads worker_heartbeats: proves the loop actually ticked, rather than
    # reporting "up" from inside a process that may be wedged.
    healthcheck:
      test: ["CMD", "node", "dist/health/worker-check.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

volumes:
  andthen-pgdata:
    name: andthen-pgdata

networks:
  internal:
    driver: bridge

# Test overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d db
#
# Publishes Postgres on 127.0.0.1 only (never 0.0.0.0), so integration tests on
# the host can reach it without exposing the database to the network.
services:
  db:
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"

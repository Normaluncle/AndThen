server {
  listen 80;
  root /usr/share/nginx/html;
  # OAuth callback query strings contain one-use credentials.
  location = /api/auth/zhihu/callback { access_log off; proxy_pass http://api:8080; proxy_read_timeout 90s; }
  location /api/ { proxy_pass http://api:8080; proxy_read_timeout 90s; }
  location / { try_files $uri /index.html; }
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
}

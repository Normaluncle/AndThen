# Opt-in local-only verification. Do not include in a server deployment.
services:
  api:
    environment:
      LOCAL_DISCOVERY_PREVIEW: 'true'
      DISCOVERY_DAILY_LIMIT: '${DISCOVERY_DAILY_LIMIT:-5}'
      DISCOVERY_DAILY_SEARCH_LIMIT: '${DISCOVERY_DAILY_SEARCH_LIMIT:-3}'
      DISCOVERY_INTERVAL_MINUTES: '${DISCOVERY_INTERVAL_MINUTES:-60}'
  worker:
    environment:
      LOCAL_DISCOVERY_PREVIEW: 'true'
      DISCOVERY_DAILY_LIMIT: '${DISCOVERY_DAILY_LIMIT:-5}'
      DISCOVERY_DAILY_SEARCH_LIMIT: '${DISCOVERY_DAILY_SEARCH_LIMIT:-3}'
      DISCOVERY_INTERVAL_MINUTES: '${DISCOVERY_INTERVAL_MINUTES:-60}'
